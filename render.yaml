services:
  - type: web
    name: apnarecord-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MASTER_KEY
        sync: false
      - key: RPC_URL
        value: https://sepolia.base.org
      - key: CHAIN_ID
        value: "84532"
      - key: EXPLORER_BASE
        value: https://sepolia.basescan.org/address/
      - key: CONTRACT_ADDRESS
        sync: false
      - key: CONTRACT_DEPLOY_BLOCK
        sync: false
      # Must list the deployed client origin exactly, scheme included. The server
      # refuses to boot in production without it rather than falling back to localhost.
      - key: CORS_ORIGINS
        sync: false
      - key: DRIPPER_PRIVATE_KEY
        sync: false
      - key: DRIP_AMOUNT
        value: "0.002"
      - key: DRIP_FLOOR
        value: "0.0005"
      - key: DRIP_DAILY_CAP
        value: "1.0"
      - key: DRIP_LOW_WATER
        value: "0.05"
      # Record blobs. Without S3_BUCKET the server writes to a local directory that a
      # redeploy wipes, leaving on-chain anchors pointing at files that no longer exist.
      - key: S3_ENDPOINT
        value: https://e54ba14ae4df92d7a2feb7780c607686.r2.cloudflarestorage.com
      - key: S3_BUCKET
        value: apnarecord
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: brevo
      - key: EMAIL_FROM
        value: ApnaRecord <no-reply@akshut.cyou>
      - key: BREVO_API_KEY
        sync: false
