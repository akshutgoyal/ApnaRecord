services:
  - type: web
    name: apnarecord-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MASTER_KEY
        sync: false
      - key: RPC_URL
        value: https://sepolia.base.org
      - key: CHAIN_ID
        value: "84532"
      - key: EXPLORER_BASE
        value: https://sepolia.basescan.org/address/
      - key: CONTRACT_ADDRESS
        sync: false
      - key: CONTRACT_DEPLOY_BLOCK
        sync: false
      # Uploads are wiped on every redeploy without a persistent disk. Mount one
      # at /opt/apnarecord/uploads and uncomment, or accept re-uploads.
      # - key: UPLOAD_DIR
      #   value: /opt/apnarecord/uploads
